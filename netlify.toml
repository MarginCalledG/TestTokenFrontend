[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Kein SPA-Redirect nötig: die Navigation läuft über React-State, nicht über
# URLs. Es gibt nur /index.html. Falls später ein Router dazukommt, hier
# ergänzen:
#   [[redirects]]
#     from = "/*"
#     to = "/index.html"
#     status = 200

[[headers]]
  for = "/*"
  [headers.values]
    # Wichtigster Header hier. Verhindert, dass die Seite in einem fremden
    # iframe eingebettet wird — bei einer Wallet-UI ist Clickjacking eine
    # echte Angriffsfläche, weil der Nutzer Approvals blind bestätigt.
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Cross-Origin-Opener-Policy = "same-origin"

    # CSP: connect-src muss beide RPCs abdecken. Erst mit verbundener Wallet
    # testen — wenn ein Connector bricht, liegt es fast immer hier.
    # 'unsafe-inline' für style-src, weil die Komponenten Inline-Styles nutzen.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://rpc.testnet.chain.robinhood.com https://rpc.mainnet.chain.robinhood.com; frame-ancestors 'none'; base-uri 'self'; form-action 'none'"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
